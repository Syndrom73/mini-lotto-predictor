name: Mini Lotto - analiza i predykcja

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb: auto, codzienna analiza albo pełny trening"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - daily
          - train
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mini-lotto-automation.yml"
      - "mini_lotto_predictor.py"
      - "automation/**"
      - "requirements.txt"
  schedule:
    # Pierwsza próba: 22:30, druga: 23:00 czasu polskiego. Pary UTC
    # obsługują zmianę czasu; bramka poniżej wybiera właściwe wpisy.
    - cron: "30 20 * * *"
    - cron: "0 21 * * *"
    - cron: "30 21 * * *"
    - cron: "0 22 * * *"

permissions:
  contents: write

concurrency:
  group: mini-lotto-automation
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Wybierz właściwy harmonogram dla czasu polskiego
        id: time_gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          scheduled_cron="${{ github.event.schedule }}"
          warsaw_offset="$(TZ=Europe/Warsaw date +%z)"

          if [[ "$warsaw_offset" == "+0200" && ( "$scheduled_cron" == "30 20 * * *" || "$scheduled_cron" == "0 21 * * *" ) ]] || \
             [[ "$warsaw_offset" == "+0100" && ( "$scheduled_cron" == "30 21 * * *" || "$scheduled_cron" == "0 22 * * *" ) ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pobierz repozytorium
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Ustaw Python
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Przywróć ostatni model
        if: steps.time_gate.outputs.run == 'true'
        id: model_cache
        uses: actions/cache/restore@v4
        with:
          path: .automation/mini_lotto_bundle.pt
          key: mini-lotto-model-v3-restore-placeholder
          restore-keys: |
            mini-lotto-model-v3-

      - name: Zainstaluj biblioteki
        if: steps.time_gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Pobierz i zweryfikuj wyniki
        if: steps.time_gate.outputs.run == 'true'
        id: results
        shell: bash
        run: |
          freshness_args=()
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "push" ]]; then
            freshness_args=(
              --require-predicted-draw
              --state-path .automation/last_prediction.json
            )
          fi
          python -m automation.download_results \
            --output wyniki-minilotto.csv \
            "${freshness_args[@]}"

      - name: Wybierz tryb
        if: steps.time_gate.outputs.run == 'true' && steps.results.outputs.new_data == 'true'
        shell: bash
        run: |
          requested="${{ inputs.mode }}"
          weekday="$(TZ=Europe/Warsaw date +%u)"
          if [[ "$requested" == "train" ]] || [[ "$requested" == "daily" ]]; then
            mode="$requested"
          elif [[ ! -f .automation/mini_lotto_bundle.pt ]] || [[ "$weekday" == "7" ]]; then
            mode="train"
          else
            mode="daily"
          fi
          echo "RUN_MODE=$mode" >> "$GITHUB_ENV"
          echo "Wybrany tryb: $mode"

      - name: Uruchom analizę i predykcję
        if: steps.time_gate.outputs.run == 'true' && steps.results.outputs.new_data == 'true'
        run: |
          python mini_lotto_predictor.py \
            --mode "$RUN_MODE" \
            --csv-path wyniki-minilotto.csv \
            --bundle-path .automation/mini_lotto_bundle.pt \
            --state-path .automation/last_prediction.json \
            --report-path reports/latest.md \
            --prediction-history-path .automation/prediction_history.csv

      - name: Utwórz kopię raportu
        if: steps.time_gate.outputs.run == 'true' && steps.results.outputs.new_data == 'true'
        shell: bash
        run: |
          draw_number="$(grep -m1 -oP 'PO LOSOWANIU MINI LOTTO \K[0-9]+' reports/latest.md)"
          report_date="$(TZ=Europe/Warsaw date +%F)"
          mkdir -p reports/archive
          cp reports/latest.md "reports/archive/${report_date}_losowanie_${draw_number}.md"

      - name: Zachowaj wytrenowany model
        if: steps.time_gate.outputs.run == 'true' && steps.results.outputs.new_data == 'true' && env.RUN_MODE == 'train'
        uses: actions/cache/save@v4
        with:
          path: .automation/mini_lotto_bundle.pt
          key: mini-lotto-model-v3-${{ github.run_id }}

      - name: Udostępnij raport jako artefakt
        if: steps.time_gate.outputs.run == 'true' && steps.results.outputs.new_data == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mini-lotto-report-${{ github.run_number }}
          path: |
            reports/latest.md
            .automation/last_prediction.json
            .automation/prediction_history.csv
          retention-days: 90

      - name: Zapisz raport i stan w repozytorium
        if: steps.time_gate.outputs.run == 'true' && steps.results.outputs.new_data == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files=(.automation/last_prediction.json reports/latest.md reports/archive/)
          if [[ -f .automation/prediction_history.csv ]]; then
            files+=(.automation/prediction_history.csv)
          fi
          git add -f "${files[@]}"
          if git diff --cached --quiet; then
            echo "Brak nowych zmian do zapisania."
          else
            git commit -m "Automatyczny raport Mini Lotto"
            git push
          fi
